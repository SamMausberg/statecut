[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "statecut"
version = "0.3.0"
description = "Exact-state cut certificates for adaptive attention evaluation"
authors = [{name = "Samuel Mausberg"}]
requires-python = ">=3.10"
license = "MIT"

[project.optional-dependencies]
test = ["pytest>=8", "mpmath>=1.3", "numpy>=1.24,<3"]
capture = ["transformers==4.57.6", "numpy>=1.24,<2", "safetensors>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
