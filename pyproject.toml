[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "statecut"
version = "0.2.0"
description = "Exact-state cut certificates for adaptive attention evaluation"
requires-python = ">=3.11"
license = "MIT"

[project.optional-dependencies]
test = ["pytest>=8", "mpmath>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
