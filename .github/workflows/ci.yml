name: correctness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[test]'
      - run: pytest -q
      - run: python scripts/run_v2_experiments.py
      - run: cmake -S . -B build && cmake --build build --parallel 2
      - run: python scripts/check_host_intervals.py
      - run: python scripts/check_host_residuals.py
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: 'false'
          build: 'true'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - run: bash scripts/check_lean.sh
# This workflow is supplied, not a record of a successful CI run.
# No hosted runner here has a GH200. CUDA/device validation is separate.
