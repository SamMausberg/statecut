name: correctness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test]' -r requirements-test.txt
      - run: pytest -q
      - run: python scripts/run_v2_experiments.py
      - run: cmake -S . -B build && cmake --build build --parallel 2
      - run: python scripts/check_host_intervals.py
      - run: python scripts/check_host_residuals.py
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y latexmk texlive-latex-extra texlive-science texlive-fonts-recommended texlive-pictures
      - run: make -C paper
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: 'false'
          build: 'true'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - run: bash scripts/check_lean.sh
# Local validation is recorded separately; this file is not a CI pass record.
# No hosted runner here has a GH200. CUDA/device validation is separate.
